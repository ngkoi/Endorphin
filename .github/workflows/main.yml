name: "Dopamine: build and upload"

on:
  push:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "LICENSE.md"
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "LICENSE.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install GNU Make & libarchive
        run: |
          brew install make libarchive
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Cache THEOS and SDK
        uses: actions/cache@v4
        id: cache-theos
        with:
          path: theos
          key: ${{ runner.os }}-theos-sdk16.5-v1

      - name: Install THEOS
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz -C $THEOS/sdks
          rm -f $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz

      - name: Cache trustcache binary
        uses: actions/cache@v4
        id: cache-trustcache
        with:
          path: /opt/procursus/bin/trustcache
          key: ${{ runner.os }}-trustcache-bin-v1

      - name: Build and Install trustcache
        if: steps.cache-trustcache.outputs.cache-hit != 'true'
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Cache Bootstraps
        uses: actions/cache@v4
        id: cache-bootstraps
        with:
          path: |
            Application/Dopamine/Resources/bootstrap_1800.tar.zst
            Application/Dopamine/Resources/bootstrap_1900.tar.zst
          key: ${{ runner.os }}-bootstraps-v1

      - name: Download Bootstraps
        if: steps.cache-bootstraps.outputs.cache-hit != 'true'
        run: |
          set -x
          cd Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Set Environment Variables
        run: |
          set -x
          T2=$(TZ=UTC-2 date +'%Y%m%d_%H%M%S')
          TS=$(date -j -f "%Y%m%d_%H%M%S" "${T2}" +%s)
          SHASH=$(git rev-parse --short HEAD)
          echo "ctime=${T2}" >> $GITHUB_ENV
          echo "ctimestamp=${TS}" >> $GITHUB_ENV
          echo "shorthash=${SHASH}" >> $GITHUB_ENV

      - name: Cache Xcode DerivedData & SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            Application/build
          key: ${{ runner.os }}-xcode-${{ hashFiles('Application/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Build
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          export BUILD_STANDALONE=0
          gmake -j$(sysctl -n hw.logicalcpu) NIGHTLY=1

      - name: Upload Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@v4
        with:
          name: Endorphin
          path: |
            ${{ github.workspace }}/Application/Dopamine.ipa
            ${{ github.workspace }}/Application/Dopamine.tipa
